<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Deep Emerald to Teal -->
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Shimmering Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#022c22" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Emerald Gradient -->
  <rect width="512" height="512" rx="112" fill="url(#emeraldBg)" />

  <!-- Center Ambient Glow -->
  <rect width="512" height="512" rx="112" fill="url(#haloGlow)" />

  <!-- Elegant Islamic Geometric Corner Accent Lines -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-opacity="0.4" stroke-dasharray="12 6" />

  <!-- Arabic Calligraphy Letter: ف (Fa for Fasaha) -->
  <g filter="url(#shadow)">
    <!-- Distinctive Diamond Calligraphic Nuqtah (Dot) -->
    <polygon points="256,92 292,128 256,164 220,128" fill="url(#goldGradient)" />

    <!-- Pure Arabic Letter Glyph rendering for authentic typography -->
    <text 
      x="256" 
      y="388" 
      text-anchor="middle" 
      font-family="'Amiri', 'Scheherazade New', 'Aref Ruqaa', 'Traditional Arabic', 'Geeza Pro', 'Noto Naskh Arabic', serif" 
      font-size="340" 
      font-weight="bold" 
      fill="url(#goldGradient)"
    >ف</text>
  </g>
</svg>
